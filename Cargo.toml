[package]
name = "rustdrivesync"
version = "1.1.1"
edition = "2021"
authors = ["RustDriveSync Contributors"]
description = "Production-ready CLI tool for one-way file synchronization with Google Drive. Features: dependency injection, rate limiting, retry with backoff, parallel uploads, and comprehensive documentation."
license = "MIT"
repository = "https://github.com/chapzin/rustdrivesync"
homepage = "https://github.com/chapzin/rustdrivesync"
documentation = "https://docs.rs/rustdrivesync"
readme = "README.md"
keywords = ["google-drive", "sync", "backup", "cli", "oauth2"]
categories = ["command-line-utilities", "filesystem", "asynchronous"]
rust-version = "1.70"
exclude = [
    ".github/",
    "docs/",
    "tests/",
    ".gitignore",
    "ARCHITECTURE_IMPROVEMENTS.md",
    "IMPLEMENTACOES_V1.md",
]

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }
ctrlc = "3.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }

# Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Google OAuth2
oauth2 = "4.4"
yup-oauth2 = "9.0"
google-drive3 = "5.0"

# File watching
notify = "6.1"
notify-debouncer-mini = "0.4"

# Hashing
md-5 = "0.10"

# File system
walkdir = "2.4"
glob = "0.3"
mime_guess = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
indicatif = "0.17"
console = "0.15"
humansize = "2.1"

# Async utilities
futures = "0.3"
async-trait = "0.1"
bytes = "1.5"

[dev-dependencies]
mockall = "0.12"
tempfile = "3.9"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
